spring.application.name=polizas-api
server.port=8080

# Base de datos en memoria (H2)
spring.datasource.url=jdbc:h2:mem:polizasdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Seguridad mínima
seguridad.api-key=123456

# Regla de negocio: incremento IPC aplicado en la renovación (5.2%)
# En producción vendría de la tabla de parámetros IPC (ver módulo 1)
poliza.ipc=0.052

# URL del servicio de edición del CORE (en la prueba apunta al mock local)
core.base-url=http://localhost:${server.port}
